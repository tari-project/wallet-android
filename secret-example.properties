# This file must *NOT* be checked into Version Control Systems,
# as it contains sensitive app configuration data.

# Sentry (sentry.io) crash reporting DSN (Data Source Name).
# Leave default value if you don't want to enable crash reporting.
sentry.public_dsn=https://0@your.sentry.dsn/0

# Tari push notification server API key.
# Leave default value if you don't want push notification support.
service.notifications.api_key=PUSH_NOTIFICATION_SERVER_KEY

# Exolix API key for the crypto swap (exchange) feature.
# Obtain your key by registering at https://exolix.com/developers
# Leave empty to disable the exchange feature (UI will still appear but API calls will fail).
exolix.api.key=YOUR_EXOLIX_API_KEY